on: [push, pull_request]

name: CI

permissions:
  contents: read

jobs:
  lints:
    name: Linux
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Apt Update
        run: sudo apt-get -y update

      - name: Install Soapy
        run: sudo apt-get -y install libsoapysdr-dev

      - name: Fmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --workspace --features=rtlsdr,aaronia_http,soapy -- -D warnings

      - name: Test
        run: cargo test --all-targets --features=aaronia_http,rtlsdr,soapy

  hydrasdr:
    name: HydraSDR (${{ matrix.features }})
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
    strategy:
      fail-fast: false
      matrix:
        features:
          - hydrasdr
          - hydrasdr,smol
          - hydrasdr,tokio
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --all-targets --no-default-features --features=${{ matrix.features }} -- -D warnings

      - name: Test
        run: cargo test --all-targets --no-default-features --features=${{ matrix.features }}

  bladerf1:
    name: bladeRF 1 (${{ matrix.features }})
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
    strategy:
      fail-fast: false
      matrix:
        features:
          - bladerf1,smol
          - bladerf1,tokio
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --all-targets --no-default-features --features=${{ matrix.features }} -- -D warnings

      - name: Test
        run: cargo test --all-targets --no-default-features --features=${{ matrix.features }}

  webusb:
    name: WebUSB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Clippy Seify WebUSB API
        run: cargo clippy --target wasm32-unknown-unknown --lib --no-default-features --features=hydrasdr,bladerf1 -- -D warnings

      - name: Clippy WebUSB example
        run: cargo clippy --manifest-path examples/webusb/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings
