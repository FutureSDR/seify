on:
  push:
  pull_request:
  workflow_call:

name: CI

permissions:
  contents: read

jobs:
  lints:
    name: Linux
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Apt Update
        run: sudo apt-get -y update

      - name: Install Soapy
        run: sudo apt-get -y install libsoapysdr-dev

      - name: Fmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --workspace --features=rtlsdr,aaronia_http,soapy -- -D warnings

      - name: Test
        run: cargo test --all-targets --features=aaronia_http,rtlsdr,soapy

      - name: Doc tests
        run: cargo test --doc --features=aaronia_http,rtlsdr,soapy

      - name: Public API docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --features=aaronia_http,rtlsdr,soapy

  native_usb:
    name: Native USB (${{ matrix.features }})
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
    strategy:
      fail-fast: false
      matrix:
        features:
          - hackrf
          - hackrf,smol
          - hackrf,tokio
          - pluto
          - pluto,smol
          - pluto,tokio
          - uhd
          - uhd,smol
          - uhd,tokio
          - hydrasdr
          - hydrasdr,smol
          - hydrasdr,tokio
          - bladerf1,smol
          - bladerf1,tokio
          - rtlsdr
          - rtlsdr,smol
          - rtlsdr,tokio
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --all-targets --no-default-features --features=${{ matrix.features }} -- -D warnings

      - name: Test
        run: cargo test --all-targets --no-default-features --features=${{ matrix.features }}

      - name: Doc tests
        run: cargo test --doc --no-default-features --features=${{ matrix.features }}

      - name: Public API docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --no-default-features --features=${{ matrix.features }}

  webusb:
    name: WebUSB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Clippy Seify WebUSB API
        run: |
          for features in bladerf1 hackrf hydrasdr pluto rtlsdr uhd bladerf1,hackrf,hydrasdr,pluto,rtlsdr,uhd; do
            cargo clippy --target wasm32-unknown-unknown --lib --no-default-features --features="$features" -- -D warnings
          done

      - name: Public WebUSB API docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          for features in bladerf1 hackrf hydrasdr pluto rtlsdr uhd bladerf1,hackrf,hydrasdr,pluto,rtlsdr,uhd; do
            cargo doc --no-deps --target wasm32-unknown-unknown --no-default-features --features="$features"
          done

      - name: Clippy WebUSB example
        run: cargo clippy --manifest-path examples/webusb/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings
